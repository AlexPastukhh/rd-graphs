# SOURCE-ONLY / NOT DEPLOYMENT-AUTHORIZED.
# Exact owner-audited P1 scoped image only. No build, no pull, no secret env.
# Do not start until separate owner GO for R7 deployment.
services:
  fortis:
    image: fortis-r7-unified-read-ask-candidate:review-p1-scoped-20261102-fac3131e
    pull_policy: never
    restart: "no"
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 100
    environment:
      FORTIS_SONAR_REGION: "eu"
      FORTIS_SONAR_ORGANIZATIONS: "alexpastukhh"
      FORTIS_SONAR_PROJECT_KEY: "AlexPastukhh_obs-planning-docs"
    ports:
      - "127.0.0.1:19103:19103"
      - "127.0.0.1:19104:19104"
    volumes:
      - type: volume
        source: r7_state
        target: /state
      - type: volume
        source: r7_identity
        target: /run/r7-identity
        read_only: true
      - type: volume
        source: r7_grant
        target: /run/r7-grant
        read_only: true
      - type: volume
        source: r7_sonar_token
        target: /run/r7-sonar-token
        read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    healthcheck:
      test: ["CMD", "python", "-m", "fortis_approvals.r7_unified_server", "health"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  r7_state:
    external: true
    name: fortis-r7-state
  r7_identity:
    external: true
    name: fortis-r7-identity
  r7_grant:
    external: true
    name: fortis-r7-grant
  r7_sonar_token:
    external: true
    name: fortis-r7-sonar-token
