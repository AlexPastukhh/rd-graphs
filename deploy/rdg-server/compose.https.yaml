services:
  proxy:
    image: caddy:2
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 128m
    environment:
      RDG_DOMAIN: ${RDG_DOMAIN:?Specify a DNS name for HTTPS}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp:size=32m,mode=1777
    networks: [backend, edge]
    depends_on:
      rdg:
        condition: service_healthy
volumes:
  caddy_data:
  caddy_config:
networks:
  edge:
