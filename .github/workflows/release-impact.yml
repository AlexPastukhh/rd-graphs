# Owner-reviewed source-only shared Release Impact check.
# Central validator comes from an immutable accepted fortis-container commit.
name: Fortis Release Impact
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read

jobs:
  release-impact:
    name: release-impact
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact PR HEAD with full merge-base history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Prepare Python for shared validation
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate catalog and PR Release Impact
        uses: AlexPastukhh/fortis-container/.github/actions/release-impact-v1@6bde4c84b9625719bc7f87b1397758636d6c85c2
